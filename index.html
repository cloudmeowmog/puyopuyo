<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法氣泡 (Puyo Puyo) 掌機練習曲</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: none; /* 防止手機瀏覽器手勢干擾 */
            user-select: none;
        }
        h2 { margin: 5px 0 10px 0; font-size: 20px; text-shadow: 0 0 5px #fff; }
        
        .settings-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 320px;
            margin-bottom: 10px;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        select {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 5px;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .btn-restart {
            background-color: #ff5555;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-restart:active { background-color: #cc4444; }
        
        .info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 320px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .game-layout {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 320px;
        }

        /* 遊戲畫布與遮罩外層 */
        .canvas-container {
            position: relative;
            width: 240px;
            height: 480px;
        }
        canvas {
            background-color: #000;
            border: 3px solid #666;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            image-rendering: pixelated;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        
        /* 開始畫面遮罩 */
        .start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            z-index: 10;
        }
        .start-overlay.hidden {
            display: none !important;
        }
        .btn-start {
            background-color: #4CAF50;
            color: white;
            border: 2px solid #388E3C;
            padding: 12px 24px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            touch-action: manipulation;
        }
        .btn-start:active {
            background-color: #388E3C;
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.5);
        }

        .next-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
        }
        #nextCanvas {
            width: 60px;
            height: 220px;
            margin-top: 5px;
            background-color: #111;
        }

        /* ======= 掌機控制器風格 ======= */
        .controller {
            margin-top: 25px;
            width: 100%;
            max-width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
            background: #2a2a2a;
            border-radius: 20px;
            border-bottom: 4px solid #111;
        }

        .d-pad {
            display: grid;
            grid-template-columns: 35px 35px 35px;
            grid-template-rows: 35px 35px 35px;
            position: relative;
        }
        .d-btn {
            background-color: #444;
            color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            font-size: 18px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .d-btn:active { background-color: #666; }
        
        .d-up { grid-column: 2; grid-row: 1; border-radius: 8px 8px 0 0; }
        .d-left { grid-column: 1; grid-row: 2; border-radius: 8px 0 0 8px; }
        .d-center { 
            grid-column: 2; grid-row: 2; 
            background-color: #444; 
            box-shadow: none;
        }
        .d-center::after {
            content: '';
            display: block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #333;
        }
        .d-right { grid-column: 3; grid-row: 2; border-radius: 0 8px 8px 0; }
        .d-down { grid-column: 2; grid-row: 3; border-radius: 0 0 8px 8px; }

        .action-buttons {
            display: flex;
            gap: 15px;
            transform: rotate(-15deg); 
            margin-right: 10px;
        }
        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .action-group:nth-child(1) {
            margin-top: 25px; 
        }
        .a-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #b00; 
            border: 2px solid #500;
            color: rgba(255,255,255,0.7);
            font-weight: bold;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 2px 4px 0 #500, inset 2px 2px 5px rgba(255,255,255,0.2);
            padding: 0;
        }
        .a-btn:active {
            box-shadow: 0 2px 0 #500, inset 2px 2px 5px rgba(255,255,255,0.2);
            transform: translateY(2px);
        }
        .btn-label {
            margin-top: 8px;
            color: #aaa;
            font-size: 14px;
            font-weight: bold;
            transform: rotate(15deg); 
            letter-spacing: 2px;
        }

        .keyboard-hint {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2>魔法氣泡掌機練習曲</h2>
    
    <!-- 難度控制列 -->
    <div class="settings-bar">
        <div>
            <label for="difficulty">難度：</label>
            <select id="difficulty">
                <option value="3">簡單 (3色)</option>
                <option value="4">中等 (4色)</option>
                <option value="5" selected>困難 (5色)</option>
            </select>
        </div>
        <button id="btnRestart" class="btn-restart">重新開始</button>
    </div>

    <div class="info">
        <div>分數: <span id="score">0</span></div>
        <div>連鎖: <span id="chain">0</span></div>
    </div>

    <!-- 遊戲佈局：主畫布與預告區 -->
    <div class="game-layout">
        <!-- 畫布與遮罩容器 -->
        <div class="canvas-container">
            <canvas id="gameCanvas" width="240" height="480"></canvas>
            <div id="startOverlay" class="start-overlay">
                <button id="btnStart" class="btn-start">開始遊戲</button>
            </div>
        </div>
        
        <div class="next-panel">
            NEXT
            <canvas id="nextCanvas" width="60" height="220"></canvas>
        </div>
    </div>

    <!-- 掌機風格控制器 -->
    <div class="controller">
        <!-- 左側十字鍵 -->
        <div class="d-pad">
            <div id="btnUp" class="d-btn d-up">▲</div>
            <div id="btnLeft" class="d-btn d-left">◀</div>
            <div class="d-center"></div>
            <div id="btnRight" class="d-btn d-right">▶</div>
            <div id="btnDown" class="d-btn d-down">▼</div>
        </div>
        
        <!-- 右側動作按鈕 -->
        <div class="action-buttons">
            <div class="action-group">
                <button id="btnRotL" class="a-btn">B</button>
                <span class="btn-label">左轉</span>
            </div>
            <div class="action-group">
                <button id="btnRotR" class="a-btn">A</button>
                <span class="btn-label">右轉</span>
            </div>
        </div>
    </div>

    <!-- 鍵盤提示 -->
    <div class="keyboard-hint">
        【電腦鍵盤支援】<br>
        移動：方向鍵 或 A/D/S | 快速落下：上 或 W<br>
        旋轉：J (左轉) / K (右轉)
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const chainEl = document.getElementById('chain');
    const diffSelect = document.getElementById('difficulty');
    const btnRestart = document.getElementById('btnRestart');
    const startOverlay = document.getElementById('startOverlay');
    const btnStart = document.getElementById('btnStart');

    // 遊戲參數設定
    const COLS = 6;
    const ROWS = 12;
    const BLOCK_SIZE = 40;
    const COLORS = [
        null, 
        '#FF3333', // 1: 紅
        '#33FF33', // 2: 綠
        '#3333FF', // 3: 藍
        '#FFFF33', // 4: 黃
        '#CC33FF'  // 5: 紫
    ];

    let grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    let score = 0;
    let currentChain = 0;
    let gameState = 'IDLE'; // IDLE(待機), PLAYING(遊玩中), ANIMATING(動畫中), GAMEOVER(結束)
    let numColors = 5; // 預設難度為5色

    let activePiece = null;
    let nextPieces = [];
    let dropInterval = 1200; // 落下速度 (1.2 秒)
    let lastDropTime = 0;

    // 遊戲初始化/重置
    function resetGame() {
        grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        score = 0;
        currentChain = 0;
        scoreEl.innerText = score;
        chainEl.innerText = currentChain;
        
        numColors = parseInt(diffSelect.value);
        nextPieces = []; 
        
        // 隱藏開始遮罩
        startOverlay.classList.add('hidden');
        gameState = 'PLAYING';
        
        spawnPiece();
        lastDropTime = Date.now();
        draw();
    }

    function getRandomColor() {
        return Math.floor(Math.random() * numColors) + 1;
    }

    function spawnPiece() {
        if (nextPieces.length === 0) {
            nextPieces.push({ c1: getRandomColor(), c2: getRandomColor() });
            nextPieces.push({ c1: getRandomColor(), c2: getRandomColor() });
        }

        const next = nextPieces.shift();
        nextPieces.push({ c1: getRandomColor(), c2: getRandomColor() });

        activePiece = {
            x: 2, y: 0,
            color1: next.c1,
            color2: next.c2,
            rot: 0
        };
        
        drawNext();

        // 檢查是否頂到最上方(遊戲結束)
        if (grid[activePiece.y][activePiece.x] !== 0) {
            gameState = 'GAMEOVER';
            draw();
            setTimeout(() => {
                alert("遊戲結束！總分: " + score);
                startOverlay.classList.remove('hidden');
                btnStart.innerText = "再來一局";
            }, 100);
        }
    }

    function getSatPos(x, y, rot) {
        switch(rot) {
            case 0: return { x: x, y: y - 1 };
            case 1: return { x: x + 1, y: y };
            case 2: return { x: x, y: y + 1 };
            case 3: return { x: x - 1, y: y };
        }
    }

    function isValid(pX, pY, pRot) {
        const sat = getSatPos(pX, pY, pRot);
        if (pX < 0 || pX >= COLS || pY >= ROWS) return false;
        if (sat.x < 0 || sat.x >= COLS || sat.y >= ROWS) return false;
        if (pY >= 0 && grid[pY][pX] !== 0) return false;
        if (sat.y >= 0 && grid[sat.y][sat.x] !== 0) return false;
        return true;
    }

    function lockPiece() {
        if (activePiece.y >= 0) grid[activePiece.y][activePiece.x] = activePiece.color1;
        const sat = getSatPos(activePiece.x, activePiece.y, activePiece.rot);
        if (sat.y >= 0) grid[sat.y][sat.x] = activePiece.color2;
        
        activePiece = null;
        gameState = 'ANIMATING';
        currentChain = 0;
        processBoard();
    }

    function processBoard() {
        let moved = applyGravity();
        
        setTimeout(() => {
            let cleared = checkClears();
            if (cleared > 0) {
                currentChain++;
                chainEl.innerText = currentChain;
                score += (cleared * 10) * currentChain;
                scoreEl.innerText = score;
                draw();
                setTimeout(processBoard, 400);
            } else if (moved) {
                setTimeout(processBoard, 100);
            } else {
                gameState = 'PLAYING';
                chainEl.innerText = '0';
                spawnPiece();
            }
        }, 150);
    }

    function applyGravity() {
        let moved = false;
        for (let c = 0; c < COLS; c++) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (grid[r][c] !== 0) {
                    let currR = r;
                    while (currR + 1 < ROWS && grid[currR + 1][c] === 0) {
                        grid[currR + 1][c] = grid[currR][c];
                        grid[currR][c] = 0;
                        currR++;
                        moved = true;
                    }
                }
            }
        }
        return moved;
    }

    function checkClears() {
        let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
        let toPop = [];

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c] !== 0 && !visited[r][c]) {
                    let color = grid[r][c];
                    let group = [];
                    let queue = [{r, c}];
                    visited[r][c] = true;

                    while(queue.length > 0) {
                        let p = queue.shift();
                        group.push(p);
                        let dirs = [[0,1], [0,-1], [1,0], [-1,0]];
                        for (let d of dirs) {
                            let nr = p.r + d[0], nc = p.c + d[1];
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && 
                                !visited[nr][nc] && grid[nr][nc] === color) {
                                visited[nr][nc] = true;
                                queue.push({r: nr, c: nc});
                            }
                        }
                    }
                    if (group.length >= 4) {
                        toPop = toPop.concat(group);
                    }
                }
            }
        }

        toPop.forEach(p => { grid[p.r][p.c] = 0; });
        return toPop.length;
    }

    function drawPuyoAtOrigin(targetCtx, px, py, colorIdx) {
        targetCtx.beginPath();
        targetCtx.arc(px + BLOCK_SIZE / 2, py + BLOCK_SIZE / 2, BLOCK_SIZE / 2 - 2, 0, Math.PI * 2);
        targetCtx.fillStyle = COLORS[colorIdx];
        targetCtx.fill();
        targetCtx.strokeStyle = '#fff';
        targetCtx.lineWidth = 1;
        targetCtx.stroke();
        
        targetCtx.beginPath();
        targetCtx.arc(px + BLOCK_SIZE / 2 - 6, py + BLOCK_SIZE / 2 - 6, BLOCK_SIZE / 6, 0, Math.PI * 2);
        targetCtx.fillStyle = 'rgba(255,255,255,0.6)';
        targetCtx.fill();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c] !== 0) {
                    drawPuyoAtOrigin(ctx, c * BLOCK_SIZE, r * BLOCK_SIZE, grid[r][c]);
                }
            }
        }

        if (activePiece && gameState === 'PLAYING') {
            drawPuyoAtOrigin(ctx, activePiece.x * BLOCK_SIZE, activePiece.y * BLOCK_SIZE, activePiece.color1);
            const sat = getSatPos(activePiece.x, activePiece.y, activePiece.rot);
            if (sat.y >= 0) {
                drawPuyoAtOrigin(ctx, sat.x * BLOCK_SIZE, sat.y * BLOCK_SIZE, activePiece.color2);
            }
        }
    }

    function drawNext() {
        nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (nextPieces.length < 2) return;
        
        const offsetX = (nextCanvas.width - BLOCK_SIZE) / 2;
        
        drawPuyoAtOrigin(nextCtx, offsetX, 10, nextPieces[0].c2);
        drawPuyoAtOrigin(nextCtx, offsetX, 50, nextPieces[0].c1);

        drawPuyoAtOrigin(nextCtx, offsetX, 120, nextPieces[1].c2);
        drawPuyoAtOrigin(nextCtx, offsetX, 160, nextPieces[1].c1);
    }

    // ======= 玩家操作邏輯 =======
    
    function moveLeft() {
        if (isValid(activePiece.x - 1, activePiece.y, activePiece.rot)) activePiece.x--;
    }
    function moveRight() {
        if (isValid(activePiece.x + 1, activePiece.y, activePiece.rot)) activePiece.x++;
    }
    function moveDown() {
        if (isValid(activePiece.x, activePiece.y + 1, activePiece.rot)) {
            activePiece.y++;
            lastDropTime = Date.now();
        } else {
            lockPiece();
        }
    }
    function hardDrop() {
        while (isValid(activePiece.x, activePiece.y + 1, activePiece.rot)) {
            activePiece.y++;
        }
        lockPiece();
        lastDropTime = Date.now();
    }
    function rotateLeft() {
        const nextRot = (activePiece.rot + 3) % 4; // 逆時針
        if (isValid(activePiece.x, activePiece.y, nextRot)) {
            activePiece.rot = nextRot;
        } else {
            if (isValid(activePiece.x + 1, activePiece.y, nextRot)) { activePiece.x++; activePiece.rot = nextRot; }
            else if (isValid(activePiece.x - 1, activePiece.y, nextRot)) { activePiece.x--; activePiece.rot = nextRot; }
        }
    }
    function rotateRight() {
        const nextRot = (activePiece.rot + 1) % 4; // 順時針
        if (isValid(activePiece.x, activePiece.y, nextRot)) {
            activePiece.rot = nextRot;
        } else {
            if (isValid(activePiece.x - 1, activePiece.y, nextRot)) { activePiece.x--; activePiece.rot = nextRot; }
            else if (isValid(activePiece.x + 1, activePiece.y, nextRot)) { activePiece.x++; activePiece.rot = nextRot; }
        }
    }

    // ======= 綁定鍵盤事件 =======
    
    document.addEventListener('keydown', (e) => {
        if (gameState !== 'PLAYING') return;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
            e.preventDefault();
        }
        switch (e.key) {
            case 'ArrowLeft': case 'a': case 'A': moveLeft(); break;
            case 'ArrowRight': case 'd': case 'D': moveRight(); break;
            case 'ArrowDown': case 's': case 'S': moveDown(); break;
            case 'ArrowUp': case 'w': case 'W': hardDrop(); break;
            case 'j': case 'J': rotateLeft(); break;
            case 'k': case 'K': rotateRight(); break;
        }
        draw();
    });

    // ======= 綁定 UI 事件與虛擬按鍵 =======

    // 開始按鈕
    btnStart.addEventListener('click', resetGame);
    
    // 重新開始按鈕
    btnRestart.addEventListener('click', () => {
        resetGame();
        btnRestart.blur();
    });
    
    diffSelect.addEventListener('change', () => {
        diffSelect.blur();
    });
    
    function bindControl(id, actionFn) {
        const btn = document.getElementById(id);
        const handler = (e) => {
            e.preventDefault(); 
            if(gameState !== 'PLAYING') return;
            actionFn();
            draw();
        };
        btn.addEventListener('touchstart', handler, {passive: false});
        btn.addEventListener('mousedown', handler);
    }

    bindControl('btnUp', hardDrop);
    bindControl('btnLeft', moveLeft);
    bindControl('btnRight', moveRight);
    bindControl('btnDown', moveDown);
    bindControl('btnRotL', rotateLeft);
    bindControl('btnRotR', rotateRight);

    // 遊戲主迴圈
    function update() {
        if (gameState === 'PLAYING') {
            let now = Date.now();
            if (now - lastDropTime > dropInterval) {
                moveDown();
            }
        }
        draw();
        requestAnimationFrame(update);
    }

    // 防止網頁上下捲動干擾(手機端)
    document.body.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    // 啟動畫面繪製與迴圈
    draw();
    update();
</script>
</body>
</html>
